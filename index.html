<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f3ed">
	<title>網頁設計快測 | 十題挑戰</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f3ed;
			--ink: #202723;
			--muted: #737970;
			--line: #d9dcd3;
			--green: #285c48;
			--lime: #d7ed68;
			--coral: #db7156;
			--white: #fffefa;
			--serif: Georgia, "Noto Serif TC", "Songti TC", serif;
			--sans: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#c6c9be 0.65px, transparent 0.65px);
			background-size: 17px 17px;
			font-family: var(--sans);
		}

		button { font: inherit; }

		.page-shell {
			width: min(100% - 40px, 1020px);
			margin: 0 auto;
			padding: 24px 0 48px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.08em;
		}

		.brand { display: flex; align-items: center; gap: 10px; }

		.brand-mark {
			display: grid;
			width: 28px;
			height: 28px;
			place-items: center;
			color: var(--paper);
			background: var(--green);
			border-radius: 50%;
			font-family: var(--serif);
			font-size: 15px;
		}

		.edition { color: var(--muted); }

		main {
			display: grid;
			grid-template-columns: minmax(230px, 0.72fr) minmax(0, 1.28fr);
			gap: clamp(32px, 7vw, 92px);
			align-items: start;
			padding-top: clamp(42px, 9vh, 84px);
		}

		.intro { position: sticky; top: 28px; }

		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 9px;
			margin: 0 0 17px;
			color: var(--green);
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 0.12em;
		}

		.eyebrow::before {
			width: 22px;
			height: 2px;
			background: var(--coral);
			content: "";
		}

		h1 {
			max-width: 390px;
			margin: 0;
			font-family: var(--serif);
			font-size: clamp(42px, 6vw, 70px);
			font-weight: 500;
			line-height: 1.12;
		}

		.intro-copy {
			max-width: 310px;
			margin: 19px 0 26px;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.9;
		}

		.fact-stamp {
			display: flex;
			width: fit-content;
			align-items: center;
			gap: 11px;
			padding: 10px 14px 10px 10px;
			background: var(--lime);
			transform: rotate(-2deg);
		}

		.stamp-number {
			display: grid;
			width: 30px;
			height: 30px;
			place-items: center;
			color: var(--white);
			background: var(--green);
			border-radius: 50%;
			font-family: var(--serif);
			font-size: 15px;
		}

		.fact-stamp span:last-child { font-size: 12px; font-weight: 800; }

		.quiz-panel {
			min-height: 430px;
			padding: clamp(22px, 4vw, 42px);
			background: var(--white);
			border: 1px solid #e3e3db;
			box-shadow: 8px 9px 0 #e0e1d7;
		}

		.panel-top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 15px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
		}

		.progress-track {
			height: 5px;
			margin: 14px 0 32px;
			overflow: hidden;
			background: #e9eae3;
			border-radius: 9px;
		}

		.progress-fill {
			width: 0;
			height: 100%;
			background: var(--green);
			border-radius: inherit;
			transition: width 240ms ease;
		}

		.question-number {
			margin: 0 0 10px;
			color: var(--coral);
			font-family: var(--serif);
			font-size: 14px;
			font-style: italic;
		}

		h2 {
			margin: 0;
			font-size: clamp(20px, 3vw, 27px);
			font-weight: 700;
			line-height: 1.55;
		}

		.answer-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-top: 25px;
		}

		.answer-button {
			display: flex;
			min-height: 58px;
			align-items: center;
			gap: 12px;
			padding: 11px 13px;
			color: var(--ink);
			text-align: left;
			background: var(--white);
			border: 1px solid var(--line);
			cursor: pointer;
			transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
		}

		.answer-button:hover:not(:disabled) {
			background: #f3f6e9;
			border-color: var(--green);
			transform: translateY(-2px);
		}

		.answer-button:focus-visible, .primary-button:focus-visible, .review-toggle:focus-visible {
			outline: 3px solid var(--coral);
			outline-offset: 3px;
		}

		.answer-button:disabled { cursor: default; }

		.answer-letter {
			display: grid;
			width: 27px;
			height: 27px;
			flex: 0 0 27px;
			place-items: center;
			color: var(--green);
			background: #edf0e8;
			border-radius: 50%;
			font-size: 11px;
			font-weight: 800;
		}

		.answer-button.is-correct { background: #edf4dc; border-color: var(--green); }
		.answer-button.is-correct .answer-letter { color: var(--white); background: var(--green); }
		.answer-button.is-wrong { background: #fbefeb; border-color: var(--coral); }
		.answer-button.is-wrong .answer-letter { color: var(--white); background: var(--coral); }

		.feedback {
			min-height: 50px;
			margin: 17px 0 0;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.7;
		}

		.feedback strong { color: var(--green); }
		.feedback strong.incorrect { color: var(--coral); }

		.panel-bottom {
			display: flex;
			min-height: 48px;
			align-items: end;
			justify-content: space-between;
			gap: 12px;
		}

		.score-note { color: var(--muted); font-size: 12px; }

		.primary-button {
			min-height: 44px;
			padding: 0 20px;
			color: var(--white);
			background: var(--green);
			border: 0;
			cursor: pointer;
			font-size: 13px;
			font-weight: 800;
			transition: background 150ms ease, transform 150ms ease;
		}

		.primary-button:hover { background: #1d4737; transform: translateY(-1px); }
		.primary-button:disabled { color: #888d83; background: #e5e7df; cursor: not-allowed; transform: none; }

		.welcome {
			display: flex;
			min-height: 315px;
			flex-direction: column;
			align-items: flex-start;
			justify-content: center;
		}

		.welcome h2 { max-width: 450px; font-family: var(--serif); font-size: 30px; font-weight: 500; }
		.welcome p { max-width: 420px; margin: 13px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.9; }

		.result-score {
			display: flex;
			align-items: baseline;
			gap: 9px;
			margin: 8px 0 18px;
		}

		.result-score strong { font-family: var(--serif); font-size: 66px; font-weight: 500; line-height: 1; }
		.result-score span { color: var(--muted); font-size: 14px; }
		.result-message { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

		.review-list { display: grid; gap: 9px; margin: 24px 0; }
		.review-item { padding: 13px 14px; background: #f5f5ef; border-left: 3px solid var(--green); }
		.review-item.is-wrong { border-left-color: var(--coral); }
		.review-item h3 { margin: 0 0 7px; font-size: 13px; line-height: 1.6; }
		.review-item p { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
		.review-item .right-answer { color: var(--green); font-weight: 700; }
		.review-toggle { padding: 0; color: var(--green); background: none; border: 0; cursor: pointer; font-size: 13px; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; }
		.footer-note { margin-top: 32px; color: var(--muted); font-size: 11px; }

		@media (max-width: 720px) {
			.page-shell { width: min(100% - 30px, 560px); padding-top: 16px; }
			main { grid-template-columns: 1fr; gap: 27px; padding-top: 40px; }
			.intro { position: static; }
			h1 { max-width: 520px; font-size: clamp(40px, 12vw, 58px); }
			.intro-copy { max-width: 440px; margin: 13px 0 17px; font-size: 14px; }
			.fact-stamp { display: none; }
			.quiz-panel { min-height: 390px; padding: 22px 19px; box-shadow: 5px 6px 0 #e0e1d7; }
			.progress-track { margin: 12px 0 25px; }
		}

		@media (max-width: 440px) {
			.answer-grid { grid-template-columns: 1fr; gap: 8px; margin-top: 19px; }
			.answer-button { min-height: 51px; }
			.panel-bottom { align-items: center; }
			.score-note { max-width: 100px; line-height: 1.5; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<div class="page-shell">
		<header class="topbar">
			<div class="brand"><span class="brand-mark" aria-hidden="true">設</span><span>網頁設計編輯室</span></div>
			<span class="edition">小小快測　/　VOL. 01</span>
		</header>

		<main>
			<section class="intro" aria-labelledby="page-title">
				<p class="eyebrow">WEB DESIGN</p>
				<h1 id="page-title">網頁設計<br>快測。</h1>
				<p class="intro-copy">用十道題目認識 HTML、CSS、響應式設計與無障礙基礎。準備好了，就開始吧。</p>
				<div class="fact-stamp"><span class="stamp-number">10</span><span>道題目・即時解答</span></div>
			</section>

			<section class="quiz-panel" aria-label="網頁設計快測題目">
				<div id="quiz-content"></div>
			</section>
		</main>
		<p class="footer-note">一題一題來，答案揭曉後會附上網頁設計小解說。</p>
	</div>

	<script>
		const questions = [
			{ text: "HTML 中，哪一個元素通常用來建立超連結？", choices: ["&lt;a&gt;", "&lt;p&gt;", "&lt;img&gt;", "&lt;section&gt;"], answer: 0, explanation: "a 是錨點元素，搭配 href 屬性即可連結到其他頁面或位置。" },
			{ text: "在 CSS 中，哪一個屬性用來設定文字顏色？", choices: ["font-style", "color", "background-color", "text-align"], answer: 1, explanation: "color 設定文字前景色；background-color 則設定元素背景色。" },
			{ text: "哪一種 CSS 寫法可以依螢幕寬度套用不同樣式？", choices: ["@keyframes", "@media", "@import", "@font-face"], answer: 1, explanation: "@media 媒體查詢可根據視窗尺寸等條件套用樣式，是響應式設計的重要工具。" },
			{ text: "要使用 Flexbox 排列元素，容器通常要設定哪個屬性值？", choices: ["position: flex", "display: flex", "float: flex", "layout: flex"], answer: 1, explanation: "在父層設定 display: flex，子元素就會成為 flex items，可進一步控制排列與對齊。" },
			{ text: "為了讓螢幕閱讀器理解圖片內容，通常應提供哪項資訊？", choices: ["alt 替代文字", "檔案大小", "圖片邊框", "載入動畫"], answer: 0, explanation: "圖片的 alt 替代文字能向螢幕閱讀器描述圖片；純裝飾圖片可使用空 alt。" },
			{ text: "在 CSS 盒模型中，padding 位於哪兩者之間？", choices: ["內容與 border", "border 與 margin", "文字與背景", "元素與視窗"], answer: 0, explanation: "盒模型由內而外通常是 content、padding、border、margin。" },
			{ text: "CSS 中，哪一種選擇器用井字號（#）開頭？", choices: ["類別選擇器", "元素選擇器", "ID 選擇器", "通用選擇器"], answer: 2, explanation: "ID 選擇器以 # 開頭，例如 #header；類別選擇器則以 . 開頭。" },
			{ text: "HTML 的 viewport meta 標籤主要有助於什麼？", choices: ["讓行動裝置依視窗寬度呈現頁面", "自動壓縮圖片", "加密網站連線", "播放影片"], answer: 0, explanation: "viewport 設定可讓頁面依裝置視窗寬度呈現，常見設定為 width=device-width, initial-scale=1。" },
			{ text: "設計文字與背景配色時，哪項做法最有助於閱讀？", choices: ["讓文字與背景顏色相近", "提高文字與背景的對比", "只用顏色區分錯誤", "把所有文字設成極小字體"], answer: 1, explanation: "足夠的文字與背景對比能提升可讀性，也能幫助低視力或色覺差異的使用者。" },
			{ text: "要使用 CSS Grid 建立網格版面，容器通常要設定哪個屬性值？", choices: ["display: block", "display: inline", "display: grid", "display: table"], answer: 2, explanation: "在容器設定 display: grid 後，可用 grid-template-columns 等屬性定義網格欄列。" }
		];

		const quizContent = document.querySelector("#quiz-content");
		let currentQuestion = 0;
		let score = 0;
		let answers = [];

		function renderWelcome() {
			quizContent.innerHTML = `
				<div class="welcome">
					<p class="eyebrow">YOUR TURN</p>
					<h2>好奇心，從一個問題開始。</h2>
					<p>共 10 題，每題有四個選項。選擇答案後就會看到解說，最後可以回顧整份答題紀錄。</p>
					<button class="primary-button" type="button" id="start-button">開始挑戰　→</button>
				</div>`;
			document.querySelector("#start-button").addEventListener("click", renderQuestion);
		}

		function renderQuestion() {
			const question = questions[currentQuestion];
			quizContent.innerHTML = `
				<div class="panel-top"><span>第 ${currentQuestion + 1} 題，共 ${questions.length} 題</span><span>得分 ${score}</span></div>
				<div class="progress-track" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${currentQuestion}"><div class="progress-fill" style="width:${currentQuestion / questions.length * 100}%"></div></div>
				<p class="question-number">QUESTION ${String(currentQuestion + 1).padStart(2, "0")}</p>
				<h2 id="question-title">${question.text}</h2>
				<div class="answer-grid" role="group" aria-labelledby="question-title">
					${question.choices.map((choice, index) => `<button class="answer-button" type="button" data-index="${index}"><span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${choice}</span></button>`).join("")}
				</div>
				<p class="feedback" id="feedback" aria-live="polite">選出你認為正確的答案。</p>
				<div class="panel-bottom"><span class="score-note">選擇後即可查看解說</span><button class="primary-button" id="next-button" type="button" disabled>${currentQuestion === questions.length - 1 ? "查看結果" : "下一題　→"}</button></div>`;

			quizContent.querySelectorAll(".answer-button").forEach((button) => {
				button.addEventListener("click", () => chooseAnswer(Number(button.dataset.index)));
			});
			document.querySelector("#next-button").addEventListener("click", () => {
				currentQuestion += 1;
				if (currentQuestion < questions.length) renderQuestion();
				else renderResult();
			});
		}

		function chooseAnswer(selected) {
			const question = questions[currentQuestion];
			const correct = selected === question.answer;
			answers[currentQuestion] = selected;
			if (correct) score += 1;

			quizContent.querySelectorAll(".answer-button").forEach((button) => {
				const choice = Number(button.dataset.index);
				button.disabled = true;
				if (choice === question.answer) button.classList.add("is-correct");
				else if (choice === selected) button.classList.add("is-wrong");
			});

			const feedback = document.querySelector("#feedback");
			feedback.innerHTML = `<strong class="${correct ? "" : "incorrect"}">${correct ? "答對了！" : "再記住這個答案。"}</strong> ${question.explanation}`;
			document.querySelector(".panel-top span:last-child").textContent = `得分 ${score}`;
			document.querySelector("#next-button").disabled = false;
			document.querySelector(".score-note").textContent = correct ? "答對 1 題" : "答案已記錄";
		}

		function renderResult() {
			const message = score === 10 ? "太精彩了，全部答對！" : score >= 7 ? "表現很棒，知識底子很扎實。" : score >= 4 ? "不錯的開始，再挑戰一次會更熟悉。" : "每一題都是新的發現，繼續保持好奇。";
			quizContent.innerHTML = `
				<p class="eyebrow">CHALLENGE COMPLETE</p>
				<h2>你的答題成績</h2>
				<div class="result-score"><strong>${score}</strong><span>/ 10 題答對</span></div>
				<p class="result-message">${message}</p>
				<button class="review-toggle" id="review-toggle" type="button" aria-expanded="false">查看答題解析　＋</button>
				<div id="review-list" class="review-list" hidden></div>
				<div class="panel-bottom"><span class="score-note">完成時間：${new Date().toLocaleDateString("zh-TW")}</span><button class="primary-button" id="restart-button" type="button">再測一次　↻</button></div>`;

			document.querySelector("#review-toggle").addEventListener("click", toggleReview);
			document.querySelector("#restart-button").addEventListener("click", restartQuiz);
		}

		function toggleReview() {
			const list = document.querySelector("#review-list");
			const toggle = document.querySelector("#review-toggle");
			const isOpen = toggle.getAttribute("aria-expanded") === "true";
			if (!isOpen) {
				list.innerHTML = questions.map((question, index) => {
					const correct = answers[index] === question.answer;
					return `<article class="review-item ${correct ? "" : "is-wrong"}"><h3>${String(index + 1).padStart(2, "0")}　${question.text}</h3><p>你的答案：${question.choices[answers[index]]}</p><p class="right-answer">正確答案：${question.choices[question.answer]}</p><p>${question.explanation}</p></article>`;
				}).join("");
			}
			list.hidden = isOpen;
			toggle.setAttribute("aria-expanded", String(!isOpen));
			toggle.textContent = isOpen ? "查看答題解析　＋" : "收起答題解析　−";
		}

		function restartQuiz() {
			currentQuestion = 0;
			score = 0;
			answers = [];
			renderQuestion();
		}

		renderWelcome();
	</script>
</body>
</html>
